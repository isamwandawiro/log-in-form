<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" 
rel="stylesheet">
  <title>log-in-form</title>
</head>
<body>
    <h1>
      TEMBEA KENYA
    
    </h1>
  <div class="container">
      <h2 id="title">
       Sign Up
      </h2>
      <form >
        <div class="input-group">
          <div class="input-field" id="nameField">
            <i class="bi bi-person-circle"></i>
            <input type="text" placeholder="Name">
          </div>
          <div class="input-field">
            <i class="bi bi-envelope-at"></i>
            <input type="email" placeholder="Email">
          </div>
           <div class="input-field">
            <i class="bi bi-lock"></i>
            <input type="password" placeholder="Password">
          </div>
      <p>Lost Password 
        <a href="#">Click Here</a>
      </p>
    </div>
      <div class="btn-field">
        <button type="button"id="signupBtn">Sign Up
        </button>
        <button type="button" class="disable" id="signinBtn">Sign In</button>
      </div>
      </form>
    </div>
  </div>
  <script src="/index.js"></script>
</body>
</html>
